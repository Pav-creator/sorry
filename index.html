<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorry Kumu</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Confetti Script for success screen -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        /* Floating animation for Yes buttons */
        .floating-yes {
            position: absolute;
            animation: floatUp 3s linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh); opacity: 0; }
        }
        body {
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen overflow-hidden font-sans m-0">
    
    <!-- Main Apology Card -->
    <div id="main-card" class="bg-white p-8 rounded-3xl shadow-2xl text-center max-w-sm w-[90%] z-10 relative transition-all duration-500">
        <!-- Cute Panda GIF -->
        <img src="https://media.tenor.com/ef301t2y87AAAAAj/tkthao219-bubududu.gif" alt="Sad Panda" class="w-48 h-48 mx-auto mb-4 rounded-xl object-cover pointer-events-none">
        
        <h1 class="text-2xl font-extrabold text-gray-800 mb-2">I'm Sorry Kumu! 🥺</h1>
        <p class="text-gray-600 mb-8 text-sm font-medium px-2">sorry yr mujhe real nahi pta tha ki tu itna bora mann jayegi 😭</p>
        
        <div class="flex justify-center gap-6">
            <button onclick="acceptApology()" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-8 rounded-full transition duration-300 shadow-lg transform hover:scale-110">Yes</button>
            <button id="no-btn" class="bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-8 rounded-full transition duration-300 shadow-lg">No</button>
        </div>
    </div>

    <!-- Success Card (Hidden initially) -->
    <div id="success-card" class="bg-white p-8 rounded-3xl shadow-2xl text-center max-w-sm w-[90%] z-20 hidden relative transform scale-95 transition-all duration-500">
        <!-- Happy Penguin GIF -->
        <img src="https://media.tenor.com/0v56rC6uPjwAAAAj/penguin-happy.gif" alt="Happy Penguin" class="w-48 h-48 mx-auto mb-4 rounded-xl object-cover pointer-events-none">
        
        <h1 class="text-2xl font-extrabold text-gray-800 mb-3">I KNEW IT! You're the best! 🎉</h1>
        <div class="flex justify-center gap-2 mb-4 text-3xl">
            ❤️❤️❤️
        </div>
        <p class="text-gray-600 mb-8 text-sm font-medium">I promise to do better! You're the best! 🥰</p>
        
        <button onclick="location.reload()" class="bg-purple-500 hover:bg-purple-600 text-white font-bold py-3 px-10 rounded-full shadow-lg transition duration-300">Thanku</button>
    </div>

    <script>
        const noBtn = document.getElementById('no-btn');
        const mainCard = document.getElementById('main-card');
        const successCard = document.getElementById('success-card');
        let yesButtonInterval;

        // When "No" is clicked, trigger the raining "Yes" buttons
        noBtn.addEventListener('click', () => {
            spawnYesButtons();
        });

        function spawnYesButtons() {
            // Spawn a quick burst of Yes buttons
            for (let i = 0; i < 20; i++) {
                setTimeout(createFloatingYes, i * 50);
            }
            
            // Keep spawning continuously
            if (!yesButtonInterval) {
                yesButtonInterval = setInterval(createFloatingYes, 150);
            }
        }

        function createFloatingYes() {
            const btn = document.createElement('button');
            btn.innerText = 'Yes';
            btn.className = 'bg-green-500 text-white font-bold py-2 px-6 rounded-full absolute shadow-xl floating-yes z-50 cursor-pointer hover:bg-green-600 transition hover:scale-110';
            
            // Random horizontal position
            const randomX = Math.random() * (window.innerWidth - 100);
            btn.style.left = `${randomX}px`;
            btn.style.bottom = `-50px`; 
            
            // Random sizes and animation speeds for natural effect
            const scale = Math.random() * 0.6 + 0.7; // Size between 0.7 and 1.3
            btn.style.transform = `scale(${scale})`;
            btn.style.animationDuration = `${Math.random() * 2 + 2}s`; // Speed between 2s and 4s

            // Clicking any floating Yes works too
            btn.onclick = acceptApology;
            
            document.body.appendChild(btn);

            // Cleanup buttons after they float up
            setTimeout(() => {
                if (document.body.contains(btn)) {
                    btn.remove();
                }
            }, 4000);
        }

        function acceptApology() {
            // Stop spawning new buttons
            clearInterval(yesButtonInterval);
            
            // Hide main card and clear all floating buttons
            mainCard.classList.add('hidden');
            document.querySelectorAll('.floating-yes').forEach(btn => btn.remove());
            
            // Show success card with a pop animation
            successCard.classList.remove('hidden');
            setTimeout(() => {
                successCard.classList.remove('scale-95');
                successCard.classList.add('scale-100');
            }, 50);
            
            // Trigger Confetti
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 100 };

            function randomInRange(min, max) {
              return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
              var timeLeft = animationEnd - Date.now();

              if (timeLeft <= 0) {
                return clearInterval(interval);
              }

              var particleCount = 50 * (timeLeft / duration);
              // Confetti from left
              confetti(Object.assign({}, defaults, { particleCount,
                origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 }
              }));
              // Confetti from right
              confetti(Object.assign({}, defaults, { particleCount,
                origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 }
              }));
            }, 250);
        }
    </script>
</body>
</html>
