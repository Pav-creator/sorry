<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorry Kumu 🥺</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Confetti Script -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Cute Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #fbc2eb, #a18cd1);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            margin: 0;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        /* Bottom Yes Bar Animation */
        #bottom-yes-bar {
            transform: translateY(100%);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        #bottom-yes-bar.show {
            transform: translateY(0);
        }

        /* Heart beating animation */
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        .heartbeat {
            display: inline-block;
            animation: heartbeat 1.5s infinite;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen">
    
    <!-- Main Apology Card -->
    <div id="main-card" class="glass-card p-8 rounded-[2rem] shadow-2xl text-center max-w-sm w-[90%] z-10 relative transition-all duration-500 transform hover:scale-105">
        <!-- Cute Panda GIF -->
        <img src="https://media.tenor.com/ef301t2y87AAAAAj/tkthao219-bubududu.gif" alt="Sad Panda" class="w-52 h-52 mx-auto mb-4 rounded-2xl object-cover pointer-events-none shadow-sm">
        
        <h1 class="text-3xl font-black text-gray-800 mb-2">I'm Sorry Kumu! <span class="heartbeat">🥺</span></h1>
        <p class="text-gray-600 mb-8 text-base font-semibold px-2">Sorry yr mujhe sach me nahi pta tha ki tu itna bura maan jayegi 😭 Please maaf kar de na?</p>
        
        <div class="flex justify-center gap-4 relative h-14">
            <button onclick="acceptApology()" class="bg-green-500 hover:bg-green-600 text-white font-black text-lg py-3 px-10 rounded-full transition-all duration-300 shadow-[0_5px_15px_rgba(34,197,94,0.4)] transform hover:scale-110 z-20">Yes</button>
            <button id="no-btn" class="bg-red-500 hover:bg-red-600 text-white font-bold text-lg py-3 px-10 rounded-full transition-all duration-200 shadow-lg absolute right-4 z-20">No</button>
        </div>
    </div>

    <!-- Success Card (Hidden initially) -->
    <div id="success-card" class="glass-card p-8 rounded-[2rem] shadow-2xl text-center max-w-sm w-[90%] z-20 hidden relative transform scale-50 opacity-0 transition-all duration-700">
        <!-- Happy Penguin GIF -->
        <img src="https://media.tenor.com/0v56rC6uPjwAAAAj/penguin-happy.gif" alt="Happy Penguin" class="w-52 h-52 mx-auto mb-4 rounded-2xl object-cover pointer-events-none shadow-sm">
        
        <h1 class="text-3xl font-black text-gray-800 mb-3">YAYYY! I KNEW IT! 🎉</h1>
        <div class="flex justify-center gap-2 mb-4 text-4xl heartbeat">
            ❤️❤️❤️
        </div>
        <p class="text-gray-600 mb-8 text-base font-bold">Thank youuu! I promise to do better. You're the best! 🥰</p>
    </div>

    <!-- Bottom Giant YES Bar (Appears when No is clicked) -->
    <div id="bottom-yes-bar" class="fixed bottom-0 left-0 w-full bg-white/90 backdrop-blur-md p-6 shadow-[0_-10px_20px_rgba(0,0,0,0.1)] rounded-t-3xl z-50 flex flex-col items-center justify-center border-t border-pink-200">
        <p class="text-pink-600 font-bold mb-3 text-lg">Koi 'No' ka option nahi hai! Please YES bol de! 🥺👇</p>
        <button onclick="acceptApology()" class="w-full max-w-md bg-gradient-to-r from-green-400 to-green-600 hover:from-green-500 hover:to-green-700 text-white font-black text-2xl py-4 px-8 rounded-full shadow-[0_10px_20px_rgba(34,197,94,0.4)] transform hover:scale-105 transition-all animate-bounce">
            YES !!! 😍
        </button>
    </div>

    <script>
        const noBtn = document.getElementById('no-btn');
        const mainCard = document.getElementById('main-card');
        const successCard = document.getElementById('success-card');
        const bottomYesBar = document.getElementById('bottom-yes-bar');

        // Dodge logic for the NO button
        noBtn.addEventListener('mouseover', moveNoButton);
        noBtn.addEventListener('touchstart', moveNoButton);

        function moveNoButton(e) {
            // Prevent default touch behavior so it doesn't click immediately
            if(e.type === 'touchstart') e.preventDefault();
            
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 50) - (window.innerWidth/2 - 50);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 50) - (window.innerHeight/2 - 50);
            
            noBtn.style.position = 'fixed';
            noBtn.style.transform = `translate(${x}px, ${y}px)`;
        }

        // When NO is actually clicked (if they manage to click it)
        noBtn.addEventListener('click', () => {
            bottomYesBar.classList.add('show');
        });

        function acceptApology() {
            // Hide everything else
            mainCard.classList.add('hidden');
            bottomYesBar.classList.remove('show');
            noBtn.style.display = 'none';
            
            // Show success card with zoom animation
            successCard.classList.remove('hidden');
            setTimeout(() => {
                successCard.classList.remove('scale-50', 'opacity-0');
                successCard.classList.add('scale-100', 'opacity-100');
            }, 50);
            
            // Trigger Confetti Party
            var duration = 4 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 100 };

            function randomInRange(min, max) {
              return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
              var timeLeft = animationEnd - Date.now();

              if (timeLeft <= 0) {
                return clearInterval(interval);
              }

              var particleCount = 50 * (timeLeft / duration);
              confetti(Object.assign({}, defaults, { particleCount,
                origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 }
              }));
              confetti(Object.assign({}, defaults, { particleCount,
                origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 }
              }));
            }, 250);
        }
    </script>
</body>
</html>
